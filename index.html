<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#f2f4f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1312" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script>
      // Apply a saved theme before first paint to avoid a flash of the wrong one.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>

      <p style="padding: 16px">Haad Fida, principal software engineer. Find my work at https://github.com/haadfida.</p>

    <script type="module" src="/src/main.tsx"></script>
